<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extremwerte in Sachaufgaben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Tokens aus dem LMG-Designsystem (Werte wie in assets/lmg.css, hier eigenständig) */
:root{
  --surface-page:#ffffff; --surface-soft:#f6f6f4; --surface-sunken:#ecece8;
  --fg-1:#17181a; --fg-2:#3d4147; --fg-3:#646a72; --fg-4:#9097a0; --fg-5:#c2c7cd;
  --line-1:#e4e5e3; --line-2:#cfd1cf; --line-3:#a8acaa;
  --mathe:#B61E33; --mathe-soft:#f5e1e3; --mathe-line:#e8b8be; --mathe-ink:#6f0f1c;
  --physik:#2C5282;
  --ok:#3f6e3a; --ok-soft:#e7eee5; --warn:#8a6a1e; --warn-soft:#f3ecd9;
  --radius-sm:4px; --radius-md:6px; --radius-lg:10px; --radius-pill:999px;
  --shadow-1:0 1px 2px rgba(20,22,25,.04),0 1px 1px rgba(20,22,25,.03);
  --font-math:"Cambria Math","STIX Two Math","STIX Two Text",Cambria,"Times New Roman",Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--surface-soft);color:var(--fg-1);
  font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--mathe)}
:focus-visible{outline:2px solid var(--mathe);outline-offset:3px;border-radius:var(--radius-sm)}
.m{font-family:var(--font-math);white-space:nowrap}
.m i{font-style:italic}
.m sup{font-size:.72em;line-height:0}
.m sub{font-size:.72em;line-height:0}

.brandline{height:4px;background:linear-gradient(90deg,var(--mathe) 0 50%,var(--physik) 50% 100%)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
@media (min-width:700px){.wrap{padding:0 24px}}
header.top{padding:12px 0 0}
.backlink{display:inline-block;margin:0 0 4px;font-size:.92rem;color:var(--fg-3);text-decoration:none;padding:6px 0}
.backlink:hover{color:var(--fg-1);text-decoration:underline}
h1{font-size:clamp(26px,4vw,34px);line-height:1.15;margin:0;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--fg-2)}

nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 12px}
nav.tabs button{border:1px solid var(--line-2);background:var(--surface-page);border-radius:var(--radius-pill);padding:6px 16px;cursor:pointer;font-size:1rem;min-height:44px}
nav.tabs button[aria-current="true"]{background:var(--fg-1);color:var(--surface-page);border-color:var(--fg-1)}
nav.tabs button.done::after{content:" ✓";color:var(--ok)}
nav.tabs button[aria-current="true"].done::after{color:var(--mathe-line)}

.btn{border:1px solid var(--mathe);background:var(--mathe);color:#fff;border-radius:var(--radius-md);padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:1rem;font-weight:600;min-height:44px}
.btn:active{background:var(--mathe-ink);border-color:var(--mathe-ink)}
.btn.ghost{background:var(--surface-page);color:var(--mathe)}
.btn.ghost:active{background:var(--mathe-soft)}
.btn.small{padding:6px 12px;font-size:.92rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}

.station{display:none;background:var(--surface-page);border:1px solid var(--line-2);border-top:6px solid var(--mathe);border-radius:var(--radius-lg);padding:14px 18px 18px;margin-bottom:20px;box-shadow:var(--shadow-1)}
.station.show{display:block}
.sthead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.chip{font-size:.85rem;border-radius:var(--radius-sm);padding:2px 9px;font-weight:700;display:inline-block;background:var(--mathe-soft);color:var(--mathe-ink)}
h2{font-size:1.45rem;margin:4px 0 0;line-height:1.2}
h3{font-size:1.1rem;margin:0 0 8px}
.lead{margin:0 0 12px;max-width:75ch}
.kontext{border-left:4px solid var(--mathe);background:var(--surface-soft);border-radius:0 var(--radius-md) var(--radius-md) 0;padding:10px 14px;margin:0 0 12px;max-width:85ch}
.kontext p{margin:4px 0}
.kontext .frage{font-weight:700}

/* Aufträge */
.q{margin:8px 0 6px}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.choice{min-height:48px;min-width:96px;padding:8px 16px;border:2px solid var(--line-3);background:var(--surface-page);border-radius:var(--radius-md);cursor:pointer;font-size:1rem;text-align:left}
.choice[aria-pressed="true"]{border-color:var(--mathe);background:var(--mathe);color:#fff;font-weight:600}
.qrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0 0}
.qrow label,.qrow .m{font-size:1.15rem}
.numin{min-height:48px;width:110px;padding:8px 12px;border:2px solid var(--line-3);border-radius:var(--radius-md);background:var(--surface-page);font-size:1.2rem;text-align:center}
.fb{margin-top:10px;padding:9px 13px;border-radius:var(--radius-md);display:none}
.fb.ok{display:block;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.fb.bad{display:block;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.fb.info{display:block;background:var(--surface-soft);border:1px solid var(--line-2)}
.fb p{margin:2px 0}
.prog{color:var(--fg-3);margin:8px 0 0}
.auftrag{margin:0 0 12px;border:2px solid var(--mathe);border-radius:var(--radius-lg);padding:12px 14px}
.auftrag p{margin:4px 0}
.auftrag.extra{border-style:dashed}
.auftrag.erledigt{border:1px solid var(--line-2);background:var(--surface-soft);padding:6px 14px;margin-bottom:8px}
.auftrag.erledigt h3{margin:0;color:var(--ok)}
.auftrag.erledigt h3::before{content:"✓ "}
.auftrag.erledigt p{color:var(--fg-2)}
.anr{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mathe-ink);display:block}
.auftrag.erledigt .anr{color:var(--fg-3)}
details.hilfe{margin:8px 0 0;border:1px dashed var(--line-3);border-radius:var(--radius-md);background:var(--surface-page)}
details.hilfe summary{cursor:pointer;padding:8px 12px;min-height:44px;color:var(--fg-2);font-weight:600}
details.hilfe p{margin:0;padding:0 12px 10px}

.panel{border:1px solid var(--line-1);border-radius:var(--radius-lg);padding:12px 14px;background:var(--surface-page);margin-bottom:14px}
.vis{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none}
.vis text{fill:var(--fg-1);font-family:var(--font-math);font-size:18px}
.vis text.sm{font-size:15px;fill:var(--fg-3)}
.vis text.ui{font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px}
.vis text.hl{fill:var(--mathe-ink);font-weight:700}
.vis text.wa{fill:var(--warn);font-weight:700}
.vis .ax{stroke:var(--fg-2);stroke-width:1.6}
.vis .tk{stroke:var(--fg-2);stroke-width:1.2}
.vis .grid{stroke:var(--line-1);stroke-width:1}
.vis .dsh{fill:var(--mathe-soft)}
.vis .dln{stroke:var(--mathe-line);stroke-width:1.5}
.vis .cur{fill:none;stroke:var(--mathe);stroke-width:3.2;stroke-linejoin:round}
.vis .cur.out{stroke:var(--fg-4);stroke-width:2;stroke-dasharray:6 5}
.vis .pt{fill:var(--mathe);stroke:#fff;stroke-width:2}
.vis .pt.out{fill:var(--fg-4)}
.vis .pt.rand{fill:var(--surface-page);stroke:var(--mathe);stroke-width:3}
.vis .sheet{fill:var(--surface-page);stroke:var(--fg-2);stroke-width:1.6}
.vis .cut{fill:var(--surface-sunken);stroke:var(--line-3);stroke-width:1}
.vis .fold{fill:none;stroke:var(--mathe);stroke-width:1.5;stroke-dasharray:5 4}
.vis .face{fill:var(--mathe-soft);stroke:var(--mathe-ink);stroke-width:1.6;stroke-linejoin:round}
.vis .face.in{fill:var(--surface-sunken)}
.vis .wall{fill:var(--surface-sunken);stroke:var(--fg-3);stroke-width:1.5}
.vis .fence{fill:none;stroke:var(--mathe);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.vis .area{fill:var(--ok-soft)}
.vis .area.no{fill:var(--warn-soft)}
.vis .gap{stroke:var(--warn);stroke-width:4;stroke-dasharray:8 6}
.vis .bar-e{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.vis .bar-k{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.vis .brk{fill:none;stroke:var(--fg-1);stroke-width:2}
.readout{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;background:var(--surface-soft);border-radius:var(--radius-md);padding:8px 14px;margin:8px 0;font-size:1.2rem}
.readout b{font-variant-numeric:tabular-nums}
.readout .neg{color:var(--warn)}
.readout .pos{color:var(--ok)}

/* Regler */
.sl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{flex:none;min-width:48px;height:48px;padding:0 8px;border:2px solid var(--line-3);border-radius:var(--radius-md);background:var(--surface-page);font-size:1.05rem;font-weight:700;cursor:pointer;line-height:1}
.step:active{background:var(--mathe-soft)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:160px;height:48px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:var(--mathe);border:4px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);margin-top:-15px}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--line-2)}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:var(--mathe);border:4px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}

.ergebnis{border:2px solid var(--ok);background:var(--ok-soft);border-radius:var(--radius-lg);padding:12px 16px;margin-top:12px}
.ergebnis h3{color:var(--ok)}
.ergebnis p,.ergebnis li{max-width:85ch}
.ergebnis ol{margin:4px 0;padding-left:22px}
.ergebnis .panel{margin:10px 0 0}
.formel{font-family:var(--font-math);font-size:1.25rem;background:var(--surface-page);border-radius:var(--radius-md);padding:8px 14px;margin:8px 0;line-height:1.9}
.duo{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:820px){.duo{grid-template-columns:1fr 1fr}}
.duo h3{margin:0 0 4px}

/* Lösungsplan */
ol.plan{counter-reset:p;list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
ol.plan li{counter-increment:p;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:var(--surface-page);border:1px solid var(--line-2);border-radius:var(--radius-md);padding:8px 10px}
ol.plan li::before{content:counter(p);width:30px;height:30px;border-radius:50%;background:var(--mathe);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.plan b{display:block}
details.plan{margin:0 0 12px;border:1px solid var(--line-2);border-radius:var(--radius-md);background:var(--surface-soft)}
details.plan summary{cursor:pointer;padding:8px 12px;min-height:44px;font-weight:600;color:var(--fg-2)}
details.plan .in{padding:0 12px 6px}

/* Variantenwahl */
.varianten{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:8px 0}
.variante{display:block;text-align:left;border:2px solid var(--line-3);border-radius:var(--radius-lg);background:var(--surface-page);padding:12px 14px;cursor:pointer;min-height:96px}
.variante:active{border-color:var(--mathe)}
.variante .vn{font-size:1.6rem;font-weight:700;color:var(--mathe)}
.variante span{display:block;color:var(--fg-2)}

/* Präsentieren */
ul.check{list-style:none;padding:0;margin:6px 0}
ul.check li{margin:4px 0}
ul.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-height:36px}
ul.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--mathe);flex:none}
.merk{border:2px solid var(--mathe);background:var(--surface-page);border-radius:var(--radius-lg);padding:12px 16px;margin-top:12px}
.merk h3{color:var(--mathe-ink)}
.merk ul{margin:4px 0;padding-left:22px}
.exit{counter-reset:e;list-style:none;padding:0;margin:0}
.exit>li{counter-increment:e;border:1px solid var(--line-2);border-radius:var(--radius-md);padding:10px 14px 10px 48px;margin:0 0 10px;position:relative;max-width:90ch}
.exit>li::before{content:counter(e);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--fg-1);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.exit p{margin:2px 0}

/* Start */
.intro p{max-width:75ch}
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:14px 0}
.karte{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid var(--line-2);border-radius:var(--radius-lg);background:var(--surface-page);padding:12px;cursor:pointer;min-height:110px}
.karte:active{border-color:var(--mathe)}
.karte .ic{width:84px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-soft);border-radius:var(--radius-md);font-family:var(--font-math);font-size:17px;line-height:1.3;text-align:center}
.karte .ic .nw{white-space:nowrap;font-size:15px}
.karte b{display:block;font-size:1.1rem}
.karte span.k{color:var(--fg-3);font-size:.92rem}
details.lehrkraft{margin-top:18px;border:1px solid var(--line-2);border-radius:var(--radius-lg);background:var(--surface-soft)}
details.lehrkraft summary{cursor:pointer;padding:12px 14px;font-weight:600;color:var(--fg-2);min-height:44px}
details.lehrkraft .in{padding:0 16px 12px}
details.lehrkraft dl{margin:0}
details.lehrkraft dt{font-weight:700;margin-top:8px}
details.lehrkraft dd{margin:0}
table.eh{border-collapse:collapse;width:100%;margin:6px 0;font-size:.95rem;background:var(--surface-page)}
table.eh th,table.eh td{border:1px solid var(--line-2);padding:5px 8px;text-align:left;vertical-align:top}
table.eh th{background:var(--surface-sunken);font-weight:600}
footer{color:var(--fg-3);font-size:.88rem;padding:0 0 28px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="brandline"></div>
<div class="wrap">
  <header class="top">
    <a class="backlink noprint" href="../../../katalog.html?stufe=E&amp;fach=mathe">← Alle Simulationen</a>
    <h1>Extremwerte in Sachaufgaben</h1>
    <p class="sub">Zielfunktion aufstellen, Definitionsmenge begründen, Kandidaten prüfen – und die Ränder nicht vergessen</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="Stationen"></nav>
  <main>
    <section class="station" id="st-0" aria-labelledby="h-0"></section>
    <section class="station" id="st-1" aria-label="Station 1"></section>
    <section class="station" id="st-2" aria-label="Station 2"></section>
    <section class="station" id="st-3" aria-label="Station 3"></section>
    <section class="station" id="st-4" aria-label="Station 4"></section>
    <section class="station" id="st-5" aria-label="Station 5"></section>
  </main>
  <footer>Diese Seite speichert und überträgt nichts. Beim Neuladen sind alle Eingaben weg.</footer>
</div>

<script>
/* =========================================================
   Hilfen
   ========================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{ const t=String(v??'').replace(/\s/g,'').replace(',','.').replace(/[−–]/g,'-'); return /^[-+]?\d*\.?\d+$/.test(t)?parseFloat(t):NaN; };
/* Zahl deutsch: Komma, schmale Tausendertrennung, echtes Minus; d = höchstens d Nachkommastellen */
const de=(v,d=2)=>{ const r=Number(v.toFixed(d)); let [i,f]=String(Math.abs(r)).split('.');
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' '); return (r<0?'−':'')+i+(f?','+f:''); };
const M=s=>`<span class="m">${s}</span>`;
const X='<i>x</i>', Y='<i>y</i>';
const near=(a,b,t)=>Math.abs(a-b)<=t;
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function fb(id,cls,html){ const e=document.getElementById(id); if(!e) return; e.className='fb '+(cls||''); e.innerHTML=html||''; }
function shell(id,chip,title,lead,exHTML){
  return `<div class="sthead"><div><span class="chip">${chip}</span><h2>${title}</h2></div>
      <button type="button" class="btn ghost small" data-reset="${id}">Station zurücksetzen</button></div>
    ${lead?`<p class="lead">${lead}</p>`:''}${exHTML}`;
}

/* Lösungsplan – Schritte wie im Unterricht (notwendiges/hinreichendes Kriterium, Skript 1) */
const PLAN=`<ol class="plan">
  <li><span><b>Verstehen</b>Skizze, Größen mit Einheiten benennen. Was soll maximal oder minimal werden? Welche Angaben braucht ihr nicht, welche Annahme müsst ihr treffen?</span></li>
  <li><span><b>Zielfunktion aufstellen</b>Die Größe, die extremal werden soll, als Funktion von ${M(X)}. Gibt es eine zweite Variable, mit der Nebenbedingung ersetzen.</span></li>
  <li><span><b>Definitionsmenge ${M('<i>D</i>')}</b>aus dem Sachzusammenhang: Welche Werte für ${M(X)} sind überhaupt möglich?</span></li>
  <li><span><b>Notwendiges Kriterium</b>${M('<i>f</i> ′(<i>x</i>) = 0')} liefert Kandidaten. Nur Kandidaten <b style="display:inline">im Inneren von ${M('<i>D</i>')}</b> zählen.</span></li>
  <li><span><b>Hinreichendes Kriterium und Ränder</b>Kandidaten mit ${M('<i>f</i> ″')} oder dem VZW-Kriterium prüfen, dann mit den Randwerten vergleichen: Wo liegt das globale Extremum?</span></li>
  <li><span><b>Antwort und Prüfen</b>Antwortsatz mit Einheit. Ist das Ergebnis in der Situation sinnvoll?</span></li></ol>`;
const planBox=()=>`<details class="plan"><summary>Lösungsplan anzeigen</summary><div class="in">${PLAN}</div></details>`;

/* =========================================================
   Darstellungen
   ========================================================= */
/* Funktionsgraph mit schattierter Definitionsmenge; außerhalb von D gestrichelt */
let clipN=0;
function plot(o){
  const W=o.w||640,H=o.h||330,L=66,R=W-18,T=18,B=H-46, id='cp'+(++clipN);
  const px=v=>L+(v-o.x0)/(o.x1-o.x0)*(R-L), py=v=>B-(v-o.y0)/(o.y1-o.y0)*(B-T);
  const y0=(o.y0<=0&&o.y1>=0)?py(0):B;
  let h=`<defs><clipPath id="${id}"><rect x="${L}" y="${T}" width="${R-L}" height="${B-T}"/></clipPath></defs>`;
  if(o.D){ const a=px(o.D[0]),b=px(o.D[1]);
    h+=`<rect class="dsh" x="${a}" y="${T}" width="${b-a}" height="${B-T}"/><line class="dln" x1="${a}" y1="${T}" x2="${a}" y2="${B}"/><line class="dln" x1="${b}" y1="${T}" x2="${b}" y2="${B}"/>
      <text class="sm" x="${(a+b)/2}" y="${T+18}" text-anchor="middle"><tspan font-style="italic">D</tspan></text>`; }
  for(let v=Math.ceil(o.y0/o.yt)*o.yt;v<=o.y1+1e-9;v+=o.yt){ const Y=py(v);
    h+=`<line class="grid" x1="${L}" y1="${Y}" x2="${R}" y2="${Y}"/><text class="sm" x="${L-8}" y="${Y+5}" text-anchor="end">${de(v)}</text>`; }
  for(let v=Math.ceil(o.x0/o.xt)*o.xt;v<=o.x1+1e-9;v+=o.xt){ const Xp=px(v);
    h+=`<line class="tk" x1="${Xp}" y1="${y0-5}" x2="${Xp}" y2="${y0+5}"/><text class="sm" x="${Xp}" y="${B+22}" text-anchor="middle">${de(v)}</text>`; }
  h+=`<line class="ax" x1="${L}" y1="${y0}" x2="${R}" y2="${y0}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${B}"/>
    <text class="sm" x="${R}" y="${B+40}" text-anchor="end">${o.xl}</text><text class="sm" x="${L+6}" y="${T+4}">${o.yl}</text>`;
  const path=(a,b)=>{ let d=''; const n=160; for(let i=0;i<=n;i++){ const v=a+(b-a)*i/n; d+=(i?'L':'M')+px(v).toFixed(1)+' '+py(o.f(v)).toFixed(1); } return d; };
  h+=`<g clip-path="url(#${id})"><path class="cur out" d="${path(o.x0,o.x1)}"/>${o.D?`<path class="cur" d="${path(o.D[0],o.D[1])}"/>`:''}</g>`;
  (o.pts||[]).forEach(p=>{ const Xp=px(p.x),Yp=py(p.y);
    h+=`<circle class="pt ${p.cls||''}" cx="${Xp}" cy="${Yp}" r="7"/><text class="${p.cls==='out'?'sm':'hl'}" x="${Xp+(p.dx||10)}" y="${Yp+(p.dy||-10)}" text-anchor="${p.anchor||'start'}">${p.t}</text>`; });
  return `<svg class="vis" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Funktionsgraph')}">${h}</svg>`;
}

/* Schachtel: links das Netz (DIN A4 mit ausgeschnittenen Ecken), rechts die gefaltete Schachtel */
function boxVis(x){
  const k=9, nx=24, ny=24, w=21*k, h=29.7*k, c=x*k;
  let s=`<rect class="sheet" x="${nx}" y="${ny}" width="${w}" height="${h}"/>`;
  [[0,0],[w-c,0],[0,h-c],[w-c,h-c]].forEach(([a,b])=>{ s+=`<rect class="cut" x="${nx+a}" y="${ny+b}" width="${c}" height="${c}"/>`; });
  if(c>0&&c<w/2) s+=`<rect class="fold" x="${nx+c}" y="${ny+c}" width="${w-2*c}" height="${h-2*c}"/>`;
  s+=`<text class="sm" x="${nx+w/2}" y="${ny-6}" text-anchor="middle">21 cm</text>
      <text class="sm" x="${nx+w+8}" y="${ny+h/2}" >29,7 cm</text>`;
  if(c>14) s+=`<text x="${nx+c/2}" y="${ny+c/2+6}" text-anchor="middle"><tspan font-style="italic">x</tspan></text>`;
  // Schachtel schräg von vorn: Länge a nach rechts, Breite b nach hinten oben, Höhe x
  const a=Math.max(0,29.7-2*x)*k, b=Math.max(0,21-2*x)*k, hh=x*k, dx=b*.45, dy=-b*.3;
  const ox=330, oy=270;
  const pt=(u,v,z)=>[ox+u+v*.45, oy-z-v*.3];  // u: nach rechts, v: nach hinten, z: nach oben
  const poly=(arr,cls)=>`<polygon class="face ${cls||''}" points="${arr.map(([u,v,z])=>pt(u,v,z).join(',')).join(' ')}"/>`;
  if(a>0&&b>0){
    s+=poly([[0,b,0],[a,b,0],[a,b,hh],[0,b,hh]],'in');           // Rückwand innen
    s+=poly([[0,0,0],[0,b,0],[0,b,hh],[0,0,hh]],'in');           // linke Wand innen
    s+=poly([[0,0,0],[a,0,0],[a,b,0],[0,b,0]],'in');             // Boden
    s+=poly([[a,0,0],[a,b,0],[a,b,hh],[a,0,hh]]);                // rechte Wand
    s+=poly([[0,0,0],[a,0,0],[a,0,hh],[0,0,hh]]);                // Vorderwand
    const [lx,ly]=pt(a/2,0,0), [rx,ry]=pt(a,b/2,0), [hx,hy]=pt(0,0,hh/2);
    s+=`<text class="sm" x="${lx}" y="${ly+22}" text-anchor="middle">${de(29.7-2*x,1)} cm</text>
        <text class="sm" x="${rx+10}" y="${ry+6}">${de(21-2*x,1)} cm</text>
        <text class="sm" x="${hx-8}" y="${hy+5}" text-anchor="end">${de(x,1)} cm</text>`;
  } else s+=`<text class="ui" x="${ox+60}" y="${oy-60}">keine Schachtel möglich</text>`;
  return `<svg class="vis" viewBox="0 0 700 330" role="img" aria-label="Netz und Schachtel für x gleich ${de(x,1)} Zentimeter">${s}</svg>`;
}

/* Gehege von oben: Mauer oben, Zaun auf drei Seiten */
function gehVis(x,wall){
  const k=20, ox=50, oy=58, y=40-2*x, fits=y<=wall+1e-9;
  let s=`<rect class="wall" x="${ox}" y="${oy-16}" width="${wall*k}" height="14"/>
    <text class="ui" x="${ox}" y="${oy-24}">Mauer, ${de(wall)} m</text>`;
  if(y>0&&x>0) s+=`<rect class="area${fits?'':' no'}" x="${ox}" y="${oy}" width="${y*k}" height="${x*k}"/>`;
  s+=`<path class="fence" d="M${ox} ${oy} V${oy+x*k} H${ox+y*k} V${oy}"/>`;
  if(!fits) s+=`<line class="gap" x1="${ox+wall*k}" y1="${oy}" x2="${ox+y*k}" y2="${oy}"/>
    <text class="wa ui" x="${ox+wall*k+8}" y="${oy-8}">hier fehlt die Mauer</text>`;
  if(x>0) s+=`<text x="${ox-8}" y="${oy+x*k/2+6}" text-anchor="end"><tspan font-style="italic">x</tspan></text>`;
  if(y>0) s+=`<text x="${ox+y*k/2}" y="${oy+x*k+26}" text-anchor="middle"><tspan font-style="italic">y</tspan> = ${de(y)} m</text>`;
  if(x>2&&y>6) s+=`<text class="hl" x="${ox+y*k/2}" y="${oy+x*k/2+6}" text-anchor="middle">${de(x*y)} m²</text>`;
  return `<svg class="vis" viewBox="0 0 900 ${oy+20*k+44}" role="img" aria-label="Gehege ${de(x)} Meter tief und ${de(y)} Meter lang, Mauer ${wall} Meter${fits?'':', zu kurz'}">${s}</svg>`;
}

/* Schülerfirma: Erlös und Kosten als Säulen, Gewinn als Differenz */
const K=x=>.01*x**3-.9*x**2+33*x+100;
function firmaVis(x,p){
  const E=p*x, Kx=K(x), G=E-Kx, sc=220/1200, base=262, bx=[120,300];
  const bar=(i,v,cls,lab)=>`<rect class="${cls}" x="${bx[i]}" y="${base-v*sc}" width="120" height="${v*sc}"/>
     <text class="ui" x="${bx[i]+60}" y="${base+24}" text-anchor="middle">${lab}</text>
     <text x="${bx[i]+60}" y="${base-v*sc-8}" text-anchor="middle">${de(v,0)} €</text>`;
  let s=`<line class="ax" x1="90" y1="${base}" x2="470" y2="${base}"/>`+bar(0,E,'bar-e','Erlös')+bar(1,Kx,'bar-k','Kosten');
  const yE=base-E*sc, yK=base-Kx*sc, xm=500;
  s+=`<path class="brk" d="M${xm-8} ${yE} H${xm} V${yK} H${xm-8}"/><line class="grid" x1="240" y1="${yE}" x2="${xm-8}" y2="${yE}"/>
     <text class="${G<0?'wa':'hl'} ui" x="${xm+10}" y="${(yE+yK)/2+6}">${G<0?'Verlust':'Gewinn'} ${de(Math.abs(G),0)} €</text>`;
  return `<svg class="vis" viewBox="0 0 680 300" role="img" aria-label="Erlös ${de(E,0)} Euro, Kosten ${de(Kx,0)} Euro">${s}</svg>`;
}

/* =========================================================
   Aufträge: gemeinsamer Ablauf
   Ein Auftrag hat title, body(s), entweder fields (Zahlen) oder opts (Auswahl),
   optional hilfe, extra (für Schnelle) und check(s,werte) → [ok?, Text, Merksatz]
   ========================================================= */
const S={}, T={}, ERGEBNIS={};
const tasks=st=>typeof T[st]==='function'?T[st](S[st]):T[st];
function renderTasks(st){
  const s=S[st], el=$('#auf-'+st), L=tasks(st); if(!el) return;
  let h='';
  L.forEach((a,i)=>{ if(i>s.t) return;
    const title=typeof a.title==='function'?a.title(s):a.title, anr=a.extra?'Für Schnelle':'Auftrag '+(i+1);
    if(i<s.t){ h+=`<div class="auftrag erledigt"><span class="anr">${anr}</span><h3>${title}</h3><p>${s.merk[i]||''}</p></div>`; return; }
    h+=`<div class="auftrag${a.extra?' extra':''}"><span class="anr">${anr}</span><h3>${title}</h3>${a.body?a.body(s):''}`;
    if(a.opts){ h+=`<p class="q">${a.q}</p><div class="choices" role="group">`+a.opts.map(([v,l])=>
        `<button type="button" class="choice" data-ch="${st}:${i}" data-val="${esc(v)}" aria-pressed="${s.val[i]===v}">${l}</button>`).join('')+`</div>`; }
    else { h+=`<div class="qrow">`+a.fields.map((f,j)=>`<label for="f-${st}-${i}-${j}">${f[0]}</label>
        <input id="f-${st}-${i}-${j}" class="numin" inputmode="decimal" autocomplete="off" value="${esc((s.val[i]||[])[j]||'')}">${f[1]?`<span>${f[1]}</span>`:''}`).join('')+
        `<button type="button" class="btn small" data-chk="${st}:${i}">Prüfen</button></div>`; }
    if(a.hilfe) h+=a.hilfe.map((t,j)=>`<details class="hilfe"><summary>Hilfe ${j+1}</summary><p>${t}</p></details>`).join('');
    h+=`<div class="fb" id="fb-${st}-${i}" role="status"></div></div>`;
  });
  if(s.t>=L.length&&ERGEBNIS[st]) h+=ERGEBNIS[st](s);
  el.innerHTML=h;
  const f=s.fb; if(f&&f.i===s.t) fb(`fb-${st}-${f.i}`,f.cls,f.html);
}
function answer(st,i,v){
  const s=S[st], a=tasks(st)[i]; s.val[i]=v;
  let w=v; if(a.fields){ w=v.map(num); if(w.some(isNaN)){ s.fb={i,cls:'info',html:'<p>Gebt in jedes Feld eine Zahl ein.</p>'}; renderTasks(st); return; } }
  const [ok,txt,merk]=a.check(s,w);
  if(ok){ s.merk[i]=merk; s.t=i+1; s.fb=null; if(s.t>=tasks(st).length){ s.done=true; updTabs(); } RENDER[st](); }
  else { s.fb={i,cls:ok===null?'info':'bad',html:`<p>${txt}</p>`}; renderTasks(st); }
}

};
const RENDER={'1':render1,'2':render2,'3':render3,'4':render4,'5':render5};
const TABS=[['0','Start'],['1','1 Schachtel'],['2','2 Gehege (A)'],['3','3 Schülerfirma (B)'],['4','4 Präsentieren'],['5','5 Exit-Ticket']];
$('#tabs').innerHTML=TABS.map(([id,l])=>`<button type="button" data-go="${id}">${l}</button>`).join('');
function go(id){
  document.querySelectorAll('.station').forEach(e=>e.classList.toggle('show',e.id==='st-'+id));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===id?'true':'false'));
}
function updTabs(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('done',!!(S[b.dataset.go]&&S[b.dataset.go].done))); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setX(st,v){ const s=S[st];
  if(st==='1'){ s.x=Math.round(clamp(v,0,10.5)*10)/10; vis1(); }
  if(st==='2'){ s.x=Math.round(clamp(v,0,20)*2)/2; vis2(); }
  if(st==='3'){ s.x=Math.round(clamp(v,0,60)); vis3(); } }

document.addEventListener('click',e=>{
  const t=e.target;
  const g=t.closest('[data-go]'); if(g){ go(g.dataset.go); $('#tabs').scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'}); return; }
  const r=t.closest('[data-reset]'); if(r){ const id=r.dataset.reset; if(confirm('Diese Station zurücksetzen? Alle Eingaben dieser Station werden gelöscht.')){ S[id]=INIT[id](); RENDER[id](); updTabs(); } return; }
  const vr=t.closest('[data-var]'); if(vr){ const [st,v]=vr.dataset.var.split(':'); S[st].v=v; RENDER[st](); return; }
  const sh=t.closest('[data-show]'); if(sh){ S['4'].vgl=!S['4'].vgl; render4(); return; }
  const c=t.closest('[data-ch]'); if(c){ const [st,i]=c.dataset.ch.split(':'); answer(st,+i,c.dataset.val); return; }
  const k=t.closest('[data-chk]'); if(k){ const [st,i]=k.dataset.chk.split(':');
    answer(st,+i,tasks(st)[+i].fields.map((_,j)=>$(`#f-${st}-${i}-${j}`).value)); return; }
  for(const st of ['1','2','3']){ const b=t.closest('[data-x'+st+']'); if(b){ setX(st,S[st].x+(+b.getAttribute('data-x'+st))); return; } }
});
document.addEventListener('input',e=>{
  const t=e.target;
  const rm=/^r([123])$/.exec(t.id); if(rm){ setX(rm[1],+t.value); return; }
  const m=/^f-(\d)-(\d+)-(\d+)$/.exec(t.id); if(m){ const s=S[m[1]]; (s.val[m[2]]=Array.isArray(s.val[m[2]])?s.val[m[2]]:[])[+m[3]]=t.value; }
});
document.addEventListener('keydown',e=>{ if(e.key!=='Enter') return;
  const m=/^f-(\d)-(\d+)-\d+$/.exec(e.target.id); if(!m) return; e.preventDefault();
  answer(m[1],+m[2],tasks(m[1])[+m[2]].fields.map((_,j)=>$(`#f-${m[1]}-${m[2]}-${j}`).value)); });

Object.keys(INIT).forEach(k=>S[k]=INIT[k]());
renderStart(); Object.values(RENDER).forEach(f=>f()); updTabs(); go('0');
</script>
</body>
</html>
