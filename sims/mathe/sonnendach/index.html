<style>

  --ok:#3f6e3a; --ok-soft:#e7eee5; --warn:#8a6a1e; --warn-soft:#f3ecd9;

html{-webkit-text-size-adjust:100%;touch-action:manipulation}

/* Formelsatz */
.m{font-family:var(--font-math);white-space:nowrap}
.m i,i.v{font-family:var(--font-math);font-style:italic}

/* Schieberegler mit großen Touch-Flächen */

.toggle{display:flex;align-items:center;gap:12px;min-height:50px;width:100%;padding:8px 14px;border:2px solid var(--line-3);border-radius:var(--radius-md);background:var(--surface-page);cursor:pointer;font-size:1.02rem;font-weight:600;text-align:left;margin-top:8px}

.seg{display:flex;border:2px solid var(--mathe);border-radius:var(--radius-md);overflow:hidden;margin:0 0 10px}
.seg button{flex:1;border:0;background:var(--surface-page);color:var(--mathe);padding:8px 10px;min-height:46px;font-weight:600;cursor:pointer;font-size:1rem}
.seg button+button{border-left:2px solid var(--mathe)}

.seglab{font-size:.95rem;color:var(--fg-3);margin:0 0 4px}

/* Aufträge */
ol.beob{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}

/* Start */
.intro p{max-width:82ch}
.startgrid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
/* =========================================================
   Hilfen: Vektoren, Zahlen, Brüche, Formelsatz
   ========================================================= */
const $=s=>document.querySelector(s);
const DEG=Math.PI/180;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const unit=a=>mul(a,1/len(a));
const lerp=(a,b,t)=>add(a,mul(sub(b,a),t));

/* Zahl mit Komma, höchstens d Nachkommastellen, echtes Minuszeichen */
function num(v,d=3){ const f=Math.pow(10,d); let r=Math.round(v*f)/f; if(Math.abs(r)<1e-12) r=0;
  let s=r.toFixed(d); if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,''); return s.replace('.',',').replace('-','−'); }
const exactAt=(v,d)=>Math.abs(v*Math.pow(10,d)-Math.round(v*Math.pow(10,d)))<1e-9;
const appr=(v,d)=>(exactAt(v,d)?'= ':'≈ ')+num(v,d);

/* Brüche (ganzzahlig, klein) */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
function Fr(n,d=1){ if(d<0){n=-n;d=-d;} const g=gcd(n,d); return {n:n/g,d:d/g}; }
const fadd=(x,y)=>Fr(x.n*y.d+y.n*x.d,x.d*y.d), fmul=(x,y)=>Fr(x.n*y.n,x.d*y.d), fdiv=(x,y)=>Fr(x.n*y.d,x.d*y.n);
const fv=x=>x.n/x.d;
const fromDec=(v,den)=>Fr(Math.round(v*den),den);
function terminating(x){ let d=x.d; while(d%2===0) d/=2; while(d%5===0) d/=5; return d===1; }
/* Bruch als Dezimalzahl (wenn abbrechend) oder als Bruch */
function fH(x){ if(x.d===1) return num(x.n,0); if(terminating(x)) return num(fv(x),6);
  return (x.n<0?'−':'')+fr(String(Math.abs(x.n)),String(x.d)); }
/* Parameter r: Bruch wie im Vertrag (15/4), bei abbrechender Dezimalzahl mit „= 3,75“ */
function rH(x){ if(x.d===1) return num(x.n,0);
  const f=(x.n<0?'−':'')+fr(String(Math.abs(x.n)),String(x.d));
  return terminating(x)?`${f} = ${num(fv(x),6)}`:f; }
/* Koordinate: exakt als Dezimalzahl oder gerundet */
function cH(x){ return terminating(x)?num(fv(x),6):'≈ '+num(fv(x),2); }

/* HTML-Bausteine */
const V=s=>`<i class="v">${s}</i>`;
const vec=s=>`<span class="vec">${s}</span>`;
const nvec=s=>`−${vec(s)}`;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sq=r=>`<span class="sq">√<span>${r}</span></span>`;
const col=a=>`<span class="cv">${a.map(x=>`<span>${typeof x==='number'?num(x,3):x}</span>`).join('')}</span>`;
const pt=(name,a)=>`${name}(${a.join('&#8201;|&#8201;')})`;
const ptn=(name,a)=>pt(name,a.map(v=>num(v,3)));
/* Faktor in Klammern, wenn negativ */
const pf=v=>v<0?`(${num(v,3)})`:num(v,3);

/* √n vereinfachen: [a,b] mit √n = a·√b */
function sqrtSimp(n){ for(let i=Math.floor(Math.sqrt(n));i>1;i--) if(n%(i*i)===0) return [i,n/(i*i)]; return [1,n]; }
/* exakter Wert von N/(√R1·√R2) (N, R1, R2 Brüche) als HTML, z. B. 2/√5 */
function cosExact(N,R1,R2){
  if(N.n===0) return '0';
  const R=fmul(R1,R2), F=fdiv(fmul(N,N),R);
  let [a1,b1]=sqrtSimp(F.n), [a2,b2]=sqrtSimp(F.d);
  const g=gcd(a1,a2); a1/=g; a2/=g;
  const part=(a,b)=>b>1?(a===1?'':a)+sq(b):String(a);
  const top=part(a1,b1), bot=part(a2,b2);
  return (N.n<0?'−':'')+(bot==='1'?top:fr(top,bot));
}

/* √R als HTML (R Bruch); Quadratzahlen werden gezogen: √1 → 1 */
function sqH(R){ const isq=n=>{ const r=Math.round(Math.sqrt(n)); return r*r===n?r:null; };
  const a=isq(R.n), b=isq(R.d); if(a!==null&&b!==null) return fH(Fr(a,b));
  if(b!==null){ const [c,r]=sqrtSimp(R.n), k=Fr(c,b);
    const coef=(k.n===1&&k.d===2)?'½':(k.d===1?(k.n===1?'':String(k.n)):fH(k)); return coef+sq(r); }
  return sq(fH(R)); }
/* Kette  N/(√R1·√R2) = exakt ≈ Dezimal  */
function cosChain(N,R1,R2){
  const v=fv(N)/Math.sqrt(fv(R1)*fv(R2));
  const ins=fr(fH(N),`${sqH(R1)} · ${sqH(R2)}`), ex=cosExact(N,R1,R2);
  let h=`${ins} = ${ex}`;
  if(ex.indexOf('<')>=0) h+=` ${exactAt(v,3)?'=':'≈'} ${num(v,3)}`;
  return {h,v};
}
/* Vieleck in der Bodenebene auf das Rechteck lo..hi (x₁, x₂) zuschneiden (Sutherland–Hodgman) */
function clipGround(pts){
  const lo=BOX.lo, hi=BOX.hi;
  const edges=[[0,lo[0],1],[0,hi[0],-1],[1,lo[1],1],[1,hi[1],-1]];
  let out=pts;
  for(const [i,c,sg] of edges){
    const inp=out; out=[]; if(!inp.length) break;
    for(let j=0;j<inp.length;j++){
      const p=inp[j], q=inp[(j+1)%inp.length], ip=sg*(p[i]-c)>=0, iq=sg*(q[i]-c)>=0;
      if(ip) out.push(p);
      if(ip!==iq){ const t=(c-p[i])/(q[i]-p[i]); out.push(lerp(p,q,t)); }
    }
  }
  return out;
}

/* lineare Terme wie „6 − r“, „3r“, „6“ */
function lin(c0,c1,v='r'){
  const t1=c1===0?'':(Math.abs(c1)===1?'':num(Math.abs(c1),3))+`<i>${v}</i>`;
  if(c1===0) return num(c0,3);
  if(c0===0) return (c1<0?'−':'')+t1;
  return num(c0,3)+(c1<0?' − ':' + ')+t1;
}

/* =========================================================
   3D-Ansicht: eigene Parallelprojektion auf SVG
   Achsen: x₁ nach vorn, x₂ nach rechts, x₃ nach oben
   ========================================================= */
const VIEW0={th:35,el:20,z:1};
/* Startansicht je Station: Station 1 zeigt nur das Dach, daher näher dran */
const VIEWS={'0':{th:48,el:24,z:1},'1':{th:58,el:10,z:2.4,c:[1.9,2.6,4]},'2':{th:48,el:24,z:1},'3':{th:48,el:24,z:1}};
VIEWS['3B']={th:60,el:10,z:1.8,c:[2.2,3,3.8]};
const view0=st=>({...VIEWS[st]});
function camera(v){
  const t=v.th*DEG,e=v.el*DEG;
  return {R:[-Math.sin(t),Math.cos(t),0],
          U:[-Math.sin(e)*Math.cos(t),-Math.sin(e)*Math.sin(t),Math.cos(e)],
          C:[Math.cos(e)*Math.cos(t),Math.cos(e)*Math.sin(t),Math.sin(e)]};
}
const BOX={lo:[-2,-2,0],hi:[9,9,9]};
/* Strecke p→q auf den Bildquader zuschneiden (Liang–Barsky) */
function clipSeg(p,q,box=BOX){
  let t0=0,t1=1; const d=sub(q,p);
  for(let i=0;i<3;i++){
    for(const [pp,qq] of [[-d[i],p[i]-box.lo[i]],[d[i],box.hi[i]-p[i]]]){
      if(Math.abs(pp)<1e-12){ if(qq<0) return null; continue; }
      const r=qq/pp;
      if(pp<0){ if(r>t1) return null; if(r>t0) t0=r; } else { if(r<t0) return null; if(r<t1) t1=r; }
    }
  }
  return [lerp(p,q,t0),lerp(p,q,t1)];
}
const inBox=(p,box=BOX)=>p.every((v,i)=>v>=box.lo[i]-1e-9&&v<=box.hi[i]+1e-9);

function Scene(svg,view,plane){
  const W=Math.max(200,svg.clientWidth||600), H=Math.max(200,svg.clientHeight||450);
  const cam=camera(view), C0=view.c||[3.5,3.4,2.4];
  const sc=Math.min(W/12.5,H/11.3)*view.z;
  const P=p=>{ const q=sub(p,C0); return [W/2+sc*dot(q,cam.R), H*0.53-sc*dot(q,cam.U)]; };
  const items=[];
  const side=plane?Math.sign(dot(plane.n,cam.C))||1:1;
  const f=p=>plane?dot(plane.n,p)-plane.d:-1;
  const push=(L,html)=>items.push({L,html});
  const xy=p=>{ const a=P(p); return a[0].toFixed(1)+','+a[1].toFixed(1); };
  function layerOf(p,q){ if(!plane) return 3; const fm=f(lerp(p,q,.5)); if(Math.abs(fm)<1e-6) return 3; return Math.sign(fm)===side?3:1; }
  function head(p,q,color,size){
    const a=P(p), b=P(q), dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy); if(l<3) return '';
    const ux=dx/l, uy=dy/l, s=size, w=s*.5;
    return `<polygon points="${b[0]},${b[1]} ${b[0]-s*ux+w*uy},${b[1]-s*uy-w*ux} ${b[0]-s*ux-w*uy},${b[1]-s*uy+w*ux}" style="fill:${color}"/>`;
  }
  function piece(p,q,cls,o){
    const L=o.L!=null?o.L:layerOf(p,q);
    let a=P(p), b=P(q);
    let h='';
    if(o.arrow){ const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy); const s=o.size||13;
      h=head(p,q,o.color,s); if(l>s){ b=[b[0]-dx/l*s*.7,b[1]-dy/l*s*.7]; } }
    push(L,`<line class="${cls}" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`+h);
  }
  return {
    W,H,P,cam,side,f,
    line(p,q,cls,o={}){
      if(o.clip){ const c=clipSeg(p,q); if(!c) return; if(o.arrow&&!inBox(q)) o={...o,arrow:false}; [p,q]=c; }
      const fp=f(p), fq=f(q);
      if(plane&&o.L==null&&fp*fq<0&&Math.abs(fp)>1e-6&&Math.abs(fq)>1e-6){
        const m=lerp(p,q,fp/(fp-fq)); piece(p,m,cls,{...o,arrow:false}); piece(m,q,cls,o);
      } else piece(p,q,cls,o);
    },
    poly(pts,cls,L){ push(L,`<polygon class="${cls}" points="${pts.map(xy).join(' ')}"/>`); },
    path(pts,cls,L){ push(L!=null?L:layerOf(pts[0],pts[pts.length-1]),`<polyline class="${cls}" points="${pts.map(xy).join(' ')}"/>`); },
    dot(p,r,cls,L=5){ const a=P(p); push(L,`<circle class="${cls}" cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${r}"/>`); },
    text(p,s,dx,dy,cls,anchor='middle',L=6,inside=false){ const a=P(p); let x=a[0]+dx, y=a[1]+dy;
      if(inside){ x=clamp(x,14,W-14); y=clamp(y,18,H-6); }
      push(L,`<text class="${cls} halo" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}">${s}</text>`); },
    /* Vektorname mit Pfeil darüber; neg = mit Minuszeichen davor */
    vlab(p,name,dx,dy,cls,color,neg){ const a=P(p), x=clamp(a[0]+dx,neg?34:16,W-16), y=clamp(a[1]+dy,28,H-8), w=11;
      let h=`<text class="${cls} halo" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${name}</text>`;
      h+=`<line x1="${x-w/2}" y1="${y-19}" x2="${x+w/2+1}" y2="${y-19}" style="stroke:${color};stroke-width:1.8"/>`+
         `<polygon points="${x+w/2+4},${y-19} ${x+w/2-1},${y-22.5} ${x+w/2-1},${y-15.5}" style="fill:${color}"/>`;
      if(neg) h+=`<text class="${cls} halo" x="${(x-12).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="end">−</text>`;
      push(6,h); },
    /* Vektorname hinter der Pfeilspitze, in Pfeilrichtung versetzt */
    vtip(base,tip,name,cls,color,neg){ const a=P(base), b=P(tip); let dx=b[0]-a[0], dy=b[1]-a[1]; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
      this.vlab(tip,name,dx*24+(neg?6:0),dy*24+(dy>0?20:4),cls,color,neg); },
    sun(p){ const a=P(p), r=15; let h='';
      for(let i=0;i<8;i++){ const w=i*Math.PI/4; h+=`<line class="sunray" x1="${(a[0]+Math.cos(w)*(r+4)).toFixed(1)}" y1="${(a[1]+Math.sin(w)*(r+4)).toFixed(1)}" x2="${(a[0]+Math.cos(w)*(r+11)).toFixed(1)}" y2="${(a[1]+Math.sin(w)*(r+11)).toFixed(1)}"/>`; }
      push(5,h+`<circle class="sun" cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${r}"/>`); },
    raw(L,h){ push(L,h); },
    render(extraDefs=''){
      items.sort((a,b)=>a.L-b.L);
      svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
      svg.innerHTML=extraDefs+items.map(i=>i.html).join('');
    }
  };
}

/* Ankerobjekt (Vertrag §3) */
const A0=[0,0,0],B0=[0,6,0],C0p=[3,6,0],D0=[3,0,0];
const PA=[0,0,3],PB=[0,6,3],PC=[3,6,2],PD=[3,0,2];
const MF=[6,2,0],MM=[6,2,6];
const NR=[1,0,3], DR=9;                  // Dach E: x₁ + 3x₃ = 9
const ROOFPLANE={n:NR,d:DR};
const inRoof=p=>p[0]>=-1e-9&&p[0]<=3+1e-9&&p[1]>=-1e-9&&p[1]<=6+1e-9;

/* Boden, Gitter, Achsen */
function drawGround(G){
  const lo=BOX.lo, hi=BOX.hi;
  G.poly([[lo[0],lo[1],0],[hi[0],lo[1],0],[hi[0],hi[1],0],[lo[0],hi[1],0]],'plate',0);
  for(let x=lo[0];x<=hi[0];x++) G.line([x,lo[1],0],[x,hi[1],0],x%3===0?'grid3':'grid',{L:0});
  for(let y=lo[1];y<=hi[1];y++) G.line([lo[0],y,0],[hi[0],y,0],y%3===0?'grid3':'grid',{L:0});
  G.line([0,0,0],[9.8,0,0],'axis',{L:0.5,arrow:true,color:'var(--fg-3)',size:11});
  G.line([0,0,0],[0,9.8,0],'axis',{L:0.5,arrow:true,color:'var(--fg-3)',size:11});
  G.line([0,0,0],[0,0,7.6],'axis',{L:0.6,arrow:true,color:'var(--fg-3)',size:11});
  G.text([10.3,0,0],'x₁',0,6,'axl','middle',6,true);
  G.text([0,10.3,0],'x₂',0,6,'axl','middle',6,true);
  if(G.cam.C[2]<.98) G.text([0,0,7.9],'x₃',0,-4,'axl','middle',6,true);
  [3,6,9].forEach(v=>{ G.text([v,0,0],String(v),-10,14,'tick','end',0.7); G.text([0,v,0],String(v),0,16,'tick','middle',0.7); });
  [3,6].forEach(v=>G.text([0,0,v],String(v),-16,14,'tick','end',0.7));
}
function drawPosts(G){
  [[A0,PA],[B0,PB],[C0p,PC],[D0,PD]].forEach(([a,b])=>G.line(a,b,'post'));
}
function drawMast(G){
  G.line(MF,MM,'mast');
  const f1=[6,2,5.35], f2=[6,2.95,5.65];
  G.raw(3,`<polygon class="flag" points="${G.P(MM).join(',')} ${G.P(f2).join(',')} ${G.P(f1).join(',')}"/>`);
  G.dot(MF,4,'dot'); G.dot(MM,5,'dot');
  G.text(MF,'F',14,6,'pt','start'); G.text(MM,'M',-12,-6,'pt','end');
}
/* Dach als gefülltes Viereck; Zellen nur sichtbar, wenn man von oben draufschaut */
function drawRoof(G,lit){
  const top=G.side>0;
  G.poly([PA,PB,PC,PD],'roof'+(top?(lit?'':' dunkel'):' unten'),2);
  if(top){ for(let i=1;i<6;i++) G.line(lerp(PA,PB,i/6),lerp(PD,PC,i/6),'cell',{L:2.1});
    for(let j=1;j<3;j++) G.line(lerp(PA,PD,j/3),lerp(PB,PC,j/3),'cell',{L:2.1}); }
}
function cornerLabels(G,ghost,aRight){
  const c=ghost?'pts':'pt';
  if(aRight) G.text(PA,'A',10,-8,c,'start'); else G.text(PA,'A',-6,-10,c,'end'); G.text(PB,'B',8,-10,c,'start');
  G.text(PC,'C',10,18,c,'start'); G.text(PD,'D',-10,18,c,'end');
}
/* Schatten von Dach, Pfosten und Mast auf dem Boden (und Mastschatten auf dem Dach) */
function drawShadows(G,u){
  if(u[2]>=-1e-9) return;
  const g=p=>sub(p,mul(u,p[2]/u[2]));
  const sh=clipGround([PA,PB,PC,PD].map(g)); if(sh.length>2) G.poly(sh,'shadow',0.2);
  [[A0,PA],[B0,PB],[C0p,PC],[D0,PD]].forEach(([a,b])=>G.line(a,g(b),'shline',{L:0.25,clip:true}));
  // Mast: Punkte (6|2|t); Strahl trifft zuerst das Dach oder den Boden
  const m=u[0]+3*u[2], ground=[], roof=[]; let cur=null, curRoof=null;
  for(let i=0;i<=240;i++){
    const t=6*i/240, p=[6,2,t], rg=-t/u[2];
    let onRoof=null;
    if(Math.abs(m)>1e-12){ const rr=(DR-6-3*t)/m; if(rr>1e-9&&rr<rg){ const h=add(p,mul(u,rr)); if(inRoof(h)) onRoof=h; } }
    if(onRoof){ if(cur){ground.push(cur);cur=null;} if(!curRoof) curRoof=[onRoof,onRoof]; else curRoof[1]=onRoof; }
    else { if(curRoof){roof.push(curRoof);curRoof=null;} const h=add(p,mul(u,rg)); if(!cur) cur=[h,h]; else cur[1]=h; }
  }
  if(cur) ground.push(cur); if(curRoof) roof.push(curRoof);
  ground.forEach(([a,b])=>{ const c=clipSeg(a,b); if(c) G.line(c[0],c[1],'shline',{L:0.3}); });
  if(G.side>0) roof.forEach(([a,b])=>G.line(a,b,'shline',{L:2.3}));
}
/* Ziehen = Drehen, zwei Finger = Zoomen, Pfeiltasten = Drehen */
function orbit(svg,st){
  const pts=new Map(); let last=null, pinch=null;
  const gv=()=>S[st].view;
  svg.addEventListener('pointerdown',e=>{
    e.preventDefault(); try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    pts.set(e.pointerId,[e.clientX,e.clientY]); svg.classList.add('dragging');
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:gv().z}; }
    last=[e.clientX,e.clientY];
  });
  svg.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return; e.preventDefault();
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    const v=gv();
    if(pts.size>=2&&pinch){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
      v.z=clamp(pinch.z*d/pinch.d,.6,2.4); }
    else if(pts.size===1&&last){ const dx=e.clientX-last[0], dy=e.clientY-last[1];
      v.th=((v.th-dx*.45)%360+540)%360-180; v.el=clamp(v.el+dy*.4,0,90); last=[e.clientX,e.clientY]; }
    viewChanged(st);
  });
  const fin=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null;
    if(pts.size===1) last=[...pts.values()][0]; else { last=null; svg.classList.remove('dragging'); } };
  svg.addEventListener('pointerup',fin); svg.addEventListener('pointercancel',fin);
  svg.addEventListener('keydown',e=>{
    const v=gv(), k=e.key;
    if(k==='ArrowLeft') v.th=((v.th+5)%360+540)%360-180; else if(k==='ArrowRight') v.th=((v.th-5)%360+540)%360-180;
    else if(k==='ArrowUp') v.el=clamp(v.el+5,0,90); else if(k==='ArrowDown') v.el=clamp(v.el-5,0,90);
    else if(k==='+') v.z=clamp(v.z*1.15,.6,2.4); else if(k==='-') v.z=clamp(v.z/1.15,.6,2.4);
    else return;
    e.preventDefault(); viewChanged(st);
  });
}
function viewbar(st){
  return `<div class="viewbar" role="group" aria-label="Ansicht">
    <button type="button" class="btn ghost small" data-view="${st}:reset">Ansicht zurücksetzen</button>
    <button type="button" class="btn ghost small" data-view="${st}:seite">Seitenansicht</button>
    <button type="button" class="btn ghost small" data-view="${st}:oben">Von oben</button>
    <button type="button" class="btn ghost small" data-view="${st}:vorn">Von vorn</button>
    <button type="button" class="btn ghost small zoom" data-view="${st}:minus" aria-label="Verkleinern">−</button>
    <button type="button" class="btn ghost small zoom" data-view="${st}:plus" aria-label="Vergrößern">+</button></div>
    <p class="hinweis">Bild mit dem Finger ziehen: drehen · zwei Finger: zoomen · zum Scrollen neben dem Bild wischen</p>`;
}
function setView(st,what){
  const v=S[st].view;
  if(what==='reset'){ Object.assign(v,view0(st==='3'&&S[3].teil==='B'?'3B':st)); }
  else if(what==='seite'){ v.th=90; v.el=0; }
  else if(what==='oben'){ v.th=0; v.el=90; }
  else if(what==='vorn'){ v.th=0; v.el=0; }
  else if(what==='plus') v.z=clamp(v.z*1.2,.6,2.4);
  else if(what==='minus') v.z=clamp(v.z/1.2,.6,2.4);
  viewChanged(st);
}
const isSide=v=>v.el<=8&&Math.abs(Math.sin(v.th*DEG))>=.97;
const isTop=v=>v.el>=75;
function viewChanged(st){
  const s=S[st], v=s.view;
  if(st==='1'){ if(isTop(v)) s.seen.oben=true; if(isSide(v)) s.seen.seite=true; }
  if(st==='2'){ if(Math.abs(v.th-VIEWS['2'].th)>25||Math.abs(v.el-VIEWS['2'].el)>15) s.seen.dreh=true; }
  if(st==='3'){ if(isTop(v)) s.seen.oben=true; }
  FIG[st](); if(BEOB[st]) BEOB[st]();
}

/* =========================================================
   Sonnenstände für Station 1 und 2 (Vektor −u zur Sonne, ganzzahlig)
   ========================================================= */
const SUNS=[[3,0,1],[2,0,1],[1,0,1],[1,0,2],[1,0,3],[0,0,1],[-1,0,3],[-1,0,2],[-1,0,1],[-2,0,1],[-3,0,1],[-4,0,1],[-6,0,1]];
const SUN0=2, SENK=4, STREIF=10;
const uOf=i=>mul(SUNS[i],-1).map(x=>x===0?0:x);          // u = Lichtrichtung (von der Sonne weg)
/* In Uetersen (53,6° N) steht die Sonne mittags höchstens etwa 60° hoch. */
const sunH=i=>Math.atan2(SUNS[i][2],Math.abs(SUNS[i][0]))/DEG;
const sunReal=i=>SUNS[i][0]>0&&sunH(i)<=60;
function sunNote(i){
  if(sunReal(i)) return '';
  if(SUNS[i][0]>=0) return 'Gedankenexperiment: So hoch steht die Sonne in Uetersen nie – mittags höchstens etwa 60°.';
  return 'Gedankenexperiment: Hinter dem Unterstand steht die Sonne in Uetersen so nicht. Wir nehmen es nur an, um zu sehen, was passiert.';
}
function geLabel(G,i){ if(!sunReal(i)) G.raw(7,`<text class="ge halo" x="${G.W-10}" y="22" text-anchor="end">Gedankenexperiment</text>`); }
function sunText(i){
  const s=SUNS[i], h=Math.atan2(s[2],Math.abs(s[0]))/DEG;
  if(s[0]===0) return 'senkrecht über dem Unterstand (90°)';
  return `${s[0]>0?'vorn':'hinten'}, ${appr(h,1).replace('= ','')}° hoch`;
}

/* Schieberegler */
const SL={
  '1:sun':{min:0,max:SUNS.length-1,step:1,name:'Sonnenstand',ends:['vorn','hinten']},
  '2:sun':{min:0,max:SUNS.length-1,step:1,name:'Sonnenstand',ends:['vorn','hinten']},
  '3:k':{min:-10,max:15,step:1,name:'Scharparameter k',ends:['−1','1,5']},
  '3:a':{min:0,max:12,step:1,name:'Scharparameter a',ends:['0','6']}
};
function slLabel(st,k){
  const v=S[st][k];
  if(k==='sun') return sunText(v);
  if(k==='k') return num(v/10,1);
  if(k==='a') return num(v/2,1);
}
function slider(st,k,lab){
  const c=SL[st+':'+k], v=S[st][k];
  return `<div class="sl"><label class="sl-l" for="r-${st}-${k}">${lab} <output id="o-${st}-${k}">${slLabel(st,k)}</output></label>
    <div class="sl-row"><button type="button" class="step" data-step="${st}:${k}:-1" aria-label="${c.name} verkleinern">−</button>
    <input type="range" id="r-${st}-${k}" data-st="${st}" data-k="${k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${v}" aria-label="${c.name}">
    <button type="button" class="step" data-step="${st}:${k}:1" aria-label="${c.name} vergrößern">+</button></div>
    <div class="sl-ends" aria-hidden="true"><span>${c.ends[0]}</span><span>${c.ends[1]}</span></div>${k==='sun'?`<p class="gedanke" id="ge-${st}" role="status" hidden></p>`:''}</div>`;
}
function syncSl(st){
  Object.keys(SL).filter(x=>x.startsWith(st+':')).forEach(x=>{
    const k=x.split(':')[1], r=$(`#r-${st}-${k}`); if(!r) return;
    r.value=S[st][k]; $(`#o-${st}-${k}`).textContent=slLabel(st,k);
    if(k==='sun'){ const g=$(`#ge-${st}`); if(g){ const t=sunNote(S[st][k]); g.textContent=t; g.hidden=!t; } }
    document.querySelectorAll(`[data-step^="${st}:${k}:"]`).forEach(b=>{ const d=+b.dataset.step.split(':')[2]; b.disabled=d<0?S[st][k]<=SL[x].min:S[st][k]>=SL[x].max; });
  });
}
function setSl(st,k,v){ const c=SL[st+':'+k]; S[st][k]=clamp(Math.round(v),c.min,c.max); UPD[st](); }
function toggle(id,on,label){ return `<button type="button" class="toggle" id="${id}" aria-pressed="${on}"><span class="knopf"></span>${label}</button>`; }

      <button type="button" class="btn ghost small" data-reset="${id}">Station zurücksetzen</button></div>

function upd1(){
  const s=S[1], sv=SUNS[s.sun];
  if(s.sun===SENK) s.seen.senk=true;

function fig1(){
  const svg=$('#svg1'); if(!svg||!svg.clientWidth) return;
  const s=S[1], sv=SUNS[s.sun], u=mul(sv,-1), sh=unit(sv), sc=dot(NR,sv);
  const G=Scene(svg,s.view,ROOFPLANE);
  drawGround(G); drawPosts(G); drawRoof(G,sc>0); cornerLabels(G,false,true); geLabel(G,s.sun);
  // Lichtbündel
  [[.25,5.5],[.75,5.5],[.5,0.4]].forEach(([fa,fb])=>{
    const q=add(lerp(PA,PD,fa),[0,fb,0]);
    G.line(add(q,mul(sh,2.6)),q,'ray thin',{arrow:true,color:'var(--warn)',size:10});
  });
  G.sun(add(Z1,mul(sh,5.2)));
  // Vektoren
  const tipN=add(Z1,NR), tipS=add(Z1,sv);
  const lam=sc/dot(NR,NR), foot=add(Z1,mul(NR,lam));
  if(s.proj){
    if(lam<0) G.line(Z1,add(foot,mul(unit(NR),-.4)),'nverl');
    if(Math.abs(lam)>1e-9){
      if(len(sub(tipS,foot))>1e-6){
        G.line(tipS,foot,'lot');
        // rechter Winkel am Lotfußpunkt
        const w=unit(sub(tipS,foot)), nn=mul(unit(NR),lam>0?-1:1), q=.22;
        G.path([add(foot,mul(w,q)),add(add(foot,mul(w,q)),mul(nn,q)),add(foot,mul(nn,q))],'lot');
      }
    }
  }
  G.line(Z1,tipN,'vn',{arrow:true,color:'var(--mathe)'});
  if(s.proj&&Math.abs(lam)>1e-9) G.line(Z1,foot,'proj');
  G.line(Z1,tipS,'vs',{arrow:true,color:'var(--warn)'});
  // Winkel φ zwischen n und −u
  const nh=unit(NR), wv=sub(sh,mul(nh,dot(sh,nh)));
  if(len(wv)>1e-6){ const w=unit(wv), phi=Math.acos(clamp(dot(sh,nh),-1,1)), pts=[];
    for(let i=0;i<=24;i++){ const t=phi*i/24; pts.push(add(Z1,add(mul(nh,.75*Math.cos(t)),mul(w,.75*Math.sin(t))))); }
    G.path(pts,'arc');
    const m=add(Z1,add(mul(nh,1.05*Math.cos(phi/2)),mul(w,1.05*Math.sin(phi/2))));
    G.text(m,'φ',0,6,'pt'); }
  G.dot(Z1,4.5,'dot');
  G.vtip(Z1,tipN,'n','lbn','var(--mathe)');

  G.render();
}

  $('#w1').innerHTML=`
    <div class="zl"><span class="t">Licht:</span> ${vec('u')} = ${col(u)} <span class="t">zur Sonne:</span> ${nvec('u')} = ${col(sv)}</div>
    <div class="zl"><span class="t">Normalenvektor:</span> ${vec('n')} = ${col([1,0,3])}</div>

/* Schnitt des Strahls p + r·u mit Dach und Boden, exakt mit Brüchen */
function calc2(p,u){
  const K=p[0]+3*p[2], m=u[0]+3*u[2];       // K + m·r = 9
  const res={K,m};
  if(m===0){ res.kind=K===DR?'in':'par'; }
  else { res.r=Fr(DR-K,m); res.P=[0,1,2].map(i=>fadd(Fr(p[i]),fmul(Fr(u[i]),res.r)));
    res.Pv=res.P.map(fv); res.onRoof=fv(res.r)>=-1e-12&&inRoof(res.Pv); }
  if(u[2]<0){ res.rg=Fr(-p[2],u[2]); res.Q=[0,1,2].map(i=>fadd(Fr(p[i]),fmul(Fr(u[i]),res.rg))); res.Qv=res.Q.map(fv); }
  // was trifft der Strahl zuerst?
  if(res.kind==='in') res.hit='in';
  else if(res.kind==='par') res.hit=res.Q?'boden':'nichts';
  else if(res.onRoof&&fv(res.r)>1e-12&&(!res.rg||fv(res.r)<=fv(res.rg)+1e-12)) res.hit='dach';
  else if(res.onRoof&&Math.abs(fv(res.r))<1e-12) res.hit='start';
  else res.hit=res.Q?'boden':'nichts';
  return res;
}

  if(s.start==='A'&&c.hit==='in') s.seen.inE=true;
  if(s.verl) s.seen.verl=true;

  document.querySelectorAll('[data-start]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.start===s.start));
}

  if(a2===0) return `<i>x</i>₁ = ${rhs}`;
  return `<i>x</i>₁ + ${a2===2?'':num(a,1)}<i>x</i>₃ = ${rhs}`;
}
function werte3(){
  const s=S[3], el=$('#w3'); if(!el) return;
  if(s.teil==='A'){
    const c=calc3(), kH=num(s.k/10,1);
    let h=`<div class="zl scroll"><i>g</i><sub>${kH}</sub>: ${vec('x')} = ${col([6,2,6])} + <i>r</i> · ${col([-1,s.k/10,-1])}</div>
      <div class="sep"></div>
      <div class="zl"><span class="t">Einsetzen in ${V('E')}: ${V('x')}₁ + 3${V('x')}₃ = 9</span></div>
      <div class="zl">(6 − <i>r</i>) + 3 · (6 − <i>r</i>) = 9 ⇔ 24 − 4<i>r</i> = 9 ⇔ <i>r</i> = ${fr(15,4)}</div>
      <div class="zl scroll"><i>P</i><sub><i>k</i></sub>(6 − ${fr(15,4)} | 2 + ${fr(15,4)}<i>k</i> | 6 − ${fr(15,4)}) = (2,25 | 2 + 3,75<i>k</i> | 2,25)</div>
      <div class="zl gross scroll"><span class="t">für ${V('k')} = ${kH}:</span> ${pt(`<i>P</i><sub>${kH}</sub>`,c.P.map(cH))}</div>`;
    if(c.on) h+=`<div class="klein">0 ≤ ${cH(c.P[1])} ≤ 6: ${V('P')}<sub>${kH}</sub> liegt auf dem Dach.</div>`;
    else { h+=`<div class="klein">${cH(c.P[1])} liegt nicht zwischen 0 und 6: Der Strahl verfehlt das Dach. Er trifft den Boden (${V('x')}₃ = 0 bei ${V('r')} = 6) in ${pt('Q',c.Q.map(cH))}${inBox(c.Qv)?'':' (außerhalb des Bildes)'}.</div>`; }
    el.innerHTML=h;
  } else {
    const a2=s.a, a=a2/2, aF=Fr(a2,2), N=fadd(Fr(1),aF), R1=fadd(Fr(1),fmul(aF,aF));
    const cosv=fv(N)/Math.sqrt(fv(R1)*2), neig=a2===0?90:Math.atan(1/a)/DEG, aH=num(a,1);
    const cosL=`cos φ = ${cosChain(N,R1,Fr(2)).h}`;
    let h=`<div class="zl"><i>E</i><sub>${aH}</sub>: ${eqA(a2)}${a2===6?' <span class="t">(Dachebene E)</span>':''}${a2===0?' <span class="t">(senkrecht)</span>':''}</div>
      <div class="zl"><span class="t">Normalenvektor:</span> ${vec('n')}<sub><i>a</i></sub> = ${col([1,0,'<i>a</i>'])} = ${col([1,0,a])}</div>
      <div class="zl"><span class="t">Neigung gegen den Boden:</span> ${exactAt(neig,1)?'':'≈ '}${num(neig,1)}°</div>
      <div class="sep"></div>
      <div class="zl scroll">${vec('n')}<sub><i>a</i></sub> ∘ (${nvec('u')}) = 1 · 1 + 0 · 0 + ${pf(a)} · 1 = ${fH(N)}</div>
      <div class="zl">|${vec('n')}<sub><i>a</i></sub>| = ${sqH(R1)}, &nbsp; |${nvec('u')}| = ${sq(2)}</div>
      <div class="zl gross scroll">${cosL}</div>
      <div class="zl gross"><span class="t">Sonnenanteil:</span> <span class="hl">${appr(cosv*100,0)} %</span> <span class="bar" aria-hidden="true"><span style="width:${(cosv*100).toFixed(1)}%"></span></span></div>`;
    if(a2===2) h+=`<div class="klein">${vec('n')}<sub>1</sub> = ${col([1,0,1])} zeigt genau zur Sonne: Das Modul steht senkrecht zum Licht.</div>`;
    el.innerHTML=h;
  }
}
function beob3(){
  const s=S[3], el=$('#beob3'); if(!el) return;
  const nk=s.spur.size;
  el.innerHTML=
    li(nk>=4&&s.seen.oben,1,`Teil A: Verändert ${V('k')} mehrmals und schaut auch <b>von oben</b>. Auf welcher Linie wandern die Schattenpunkte ${V('P')}<sub>${V('k')}</sub>?`)+
    li(false,2,`Teil A: Vergleicht ${V('r')} in der Rechnung für verschiedene ${V('k')}. Was fällt auf? Was bedeutet das für die Höhe des Schattens?`,true)+
    li(s.seen.links&&s.seen.rechts,3,`Teil A: Für welche ${V('k')} liegt der Schatten der Mastspitze noch auf dem Dach? Sucht die Grenzen auf beiden Seiten.`)+
    li(s.seen.senk,4,`Teil B: Neigt das Modul, bis die Sonne <b>senkrecht</b> auftrifft (100 %). Welches ${V('a')} ist das, wie steil steht das Modul?`)+
    li(s.seen.senkrecht,5,`Teil B: Stellt das Modul senkrecht wie eine Hauswand. Welche Gleichung hat ${V('E')}<sub>${V('a')}</sub>, wie viel Sonne bekommt es?`);
}

/* =========================================================
   Navigation und Ereignisse
   ========================================================= */
const FIG={'0':fig0,'1':fig1,'2':()=>fig2(),'3':fig3};
const BEOB={'1':beob1,'2':beob2,'3':beob3};
const UPD={'1':upd1,'2':upd2,'3':upd3};
const RENDER={'1':render1,'2':render2,'3':render3};
const TABS=[['0','Start'],['1','1 Sonnenanteil'],['2','2 Schatten'],['3','3 Scharen']];
$('#tabs').innerHTML=TABS.map(([id,l])=>`<button type="button" data-go="${id}">${l}</button>`).join('');
const HASH={'#station1':'1','#station2':'2','#station3':'3'};
const fromHash=()=>HASH[location.hash]||'0';
let current='0';
function go(id){
  current=id;
  document.querySelectorAll('.station').forEach(e=>e.classList.toggle('show',e.id==='st-'+id));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===id?'true':'false'));
  FIG[id]();
}
function nav(id){
  if(id==='0'){ if(location.hash) history.pushState(null,'',location.pathname+location.search); }
  else if(location.hash!=='#station'+id) history.pushState(null,'','#station'+id);
  go(id);
  $('#tabs').scrollIntoView({block:'start'});
}
window.addEventListener('hashchange',()=>go(fromHash()));
window.addEventListener('popstate',()=>go(fromHash()));

document.addEventListener('click',e=>{
  const t=e.target;
  const g=t.closest('[data-go]'); if(g){ nav(g.dataset.go); return; }
  const v=t.closest('[data-view]'); if(v){ const [st,w]=v.dataset.view.split(':'); setView(st,w); return; }
  const r=t.closest('[data-reset]'); if(r){ const id=r.dataset.reset;
    if(confirm('Diese Station zurücksetzen? Alle Einstellungen dieser Station werden gelöscht.')){ S[id]=INIT[id](); RENDER[id](); } return; }
  const st=t.closest('[data-step]'); if(st){ const [sid,k,dv]=st.dataset.step.split(':'); setSl(sid,k,S[sid][k]+(+dv)); return; }
  const sb=t.closest('[data-start]'); if(sb){ S[2].start=sb.dataset.start; upd2(); return; }
  const tb=t.closest('[data-teil]'); if(tb){ if(S[3].teil!==tb.dataset.teil){ S[3].teil=tb.dataset.teil; S[3].view=view0(S[3].teil==='B'?'3B':'3'); render3(); } return; }
  if(t.closest('#proj1')){ S[1].proj=!S[1].proj; upd1(); return; }
  if(t.closest('#verl2')){ S[2].verl=!S[2].verl; upd2(); return; }
  if(t.closest('#sch2')){ S[2].schatten=!S[2].schatten; upd2(); return; }
  if(t.closest('#line3')){ S[3].spurline=!S[3].spurline; upd3(); return; }
  if(t.closest('#clear3')){ S[3].spur=new Set([S[3].k]); upd3(); return; }
});
document.addEventListener('input',e=>{
  const t=e.target; if(t.type!=='range') return;
  setSl(t.dataset.st,t.dataset.k,+t.value);
});
let rsT=null;
window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>FIG[current](),60); });

Object.keys(INIT).forEach(k=>S[k]=INIT[k]());
renderStart(); render1(); render2(); render3();
go(fromHash());
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>FIG[current]());
</script>
</body>
</html>
